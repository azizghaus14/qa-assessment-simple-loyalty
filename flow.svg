<rect x="180.0" y="40" width="300" height="52" rx="6" fill="#e6f4ff" stroke="#0958d9"/>
<text x="330" y="62.5" font-size="12" text-anchor="middle" fill="#111">START: Finance executive opens SMS Credit</text>
<text x="330" y="77.5" font-size="12" text-anchor="middle" fill="#111">Top-Up</text>
<rect x="165.0" y="140" width="330" height="46" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="167.0" font-size="12" text-anchor="middle" fill="#111">Load brand list from MikeTango database</text>
<polygon points="330,240 495.0,263.0 330,286 165.0,263.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="267.0" font-size="12" text-anchor="middle" fill="#111">Brand list loaded?</text>
<rect x="615.0" y="240" width="430" height="52" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="262.5" font-size="11" text-anchor="middle" fill="#111">ERR-01 "Unable to load brands. Please try again."</text>
<text x="830" y="277.5" font-size="11" text-anchor="middle" fill="#111">Action: show Retry; no data changed</text>
<rect x="165.0" y="350" width="330" height="46" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="377.0" font-size="12" text-anchor="middle" fill="#111">Finance executive selects a brand</text>
<polygon points="330,450 495.0,473.0 330,496 165.0,473.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="477.0" font-size="12" text-anchor="middle" fill="#111">Brand has at least one outlet?</text>
<rect x="615.0" y="450" width="430" height="67" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="472.5" font-size="11" text-anchor="middle" fill="#111">ERR-02 "No outlets found under this brand.</text>
<text x="830" y="487.5" font-size="11" text-anchor="middle" fill="#111">Please contact support."</text>
<text x="830" y="502.5" font-size="11" text-anchor="middle" fill="#111">Action: return to brand selection</text>
<rect x="165.0" y="560" width="330" height="67" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="582.5" font-size="12" text-anchor="middle" fill="#111">Display outlets: outlet name, company (billing</text>
<text x="330" y="597.5" font-size="12" text-anchor="middle" fill="#111">entity),</text>
<text x="330" y="612.5" font-size="12" text-anchor="middle" fill="#111">current SMS balance</text>
<rect x="165.0" y="670" width="330" height="52" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="692.5" font-size="12" text-anchor="middle" fill="#111">Finance executive enters top-up quantity per</text>
<text x="330" y="707.5" font-size="12" text-anchor="middle" fill="#111">outlet</text>
<polygon points="330,770 495.0,796.0 330,822 165.0,796.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="792.5" font-size="12" text-anchor="middle" fill="#111">Input valid? (integer, > 0, within max,</text>
<text x="330" y="807.5" font-size="12" text-anchor="middle" fill="#111">at least one outlet filled)</text>
<rect x="615.0" y="770" width="430" height="97" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="792.5" font-size="11" text-anchor="middle" fill="#111">ERR-03 inline per field:</text>
<text x="830" y="807.5" font-size="11" text-anchor="middle" fill="#111">"Enter a whole number greater than 0"</text>
<text x="830" y="822.5" font-size="11" text-anchor="middle" fill="#111">"Maximum 100,000 credits per outlet"</text>
<text x="830" y="837.5" font-size="11" text-anchor="middle" fill="#111">"Enter a top-up for at least one outlet"</text>
<text x="830" y="852.5" font-size="11" text-anchor="middle" fill="#111">Action: block Next; keep entered values</text>
<polygon points="330,890 495.0,916.0 330,942 165.0,916.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="912.5" font-size="12" text-anchor="middle" fill="#111">Billing email present and valid</text>
<text x="330" y="927.5" font-size="12" text-anchor="middle" fill="#111">for every selected company?</text>
<rect x="615.0" y="890" width="430" height="67" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="912.5" font-size="11" text-anchor="middle" fill="#111">ERR-04 "Billing email missing or invalid for</text>
<text x="830" y="927.5" font-size="11" text-anchor="middle" fill="#111">{company}. Update the client record first."</text>
<text x="830" y="942.5" font-size="11" text-anchor="middle" fill="#111">Action: block Next; no quotation, no credits</text>
<rect x="165.0" y="1000" width="330" height="52" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="1022.5" font-size="12" text-anchor="middle" fill="#111">Click NEXT: disable button, create idempotency</text>
<text x="330" y="1037.5" font-size="12" text-anchor="middle" fill="#111">key</text>
<rect x="165.0" y="1090" width="330" height="52" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="1112.5" font-size="12" text-anchor="middle" fill="#111">Call QuickBooks API: generate quotation</text>
<text x="330" y="1127.5" font-size="12" text-anchor="middle" fill="#111">(line item per company)</text>
<polygon points="330,1190 495.0,1213.0 330,1236 165.0,1213.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="1217.0" font-size="12" text-anchor="middle" fill="#111">Quotation generated?</text>
<rect x="615.0" y="1190" width="430" height="82" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="1212.5" font-size="11" text-anchor="middle" fill="#111">ERR-05 "Quotation could not be generated.</text>
<text x="830" y="1227.5" font-size="11" text-anchor="middle" fill="#111">No credits have been added."</text>
<text x="830" y="1242.5" font-size="11" text-anchor="middle" fill="#111">Action: Retry with SAME idempotency key;</text>
<text x="830" y="1257.5" font-size="11" text-anchor="middle" fill="#111">no duplicate quotation, no partial credit</text>
<rect x="165.0" y="1300" width="330" height="67" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="1322.5" font-size="12" text-anchor="middle" fill="#111">Credit SMS to EACH company account</text>
<text x="330" y="1337.5" font-size="12" text-anchor="middle" fill="#111">(single atomic transaction, balance = balance +</text>
<text x="330" y="1352.5" font-size="12" text-anchor="middle" fill="#111">top-up)</text>
<polygon points="330,1400 495.0,1423.0 330,1446 165.0,1423.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="1427.0" font-size="12" text-anchor="middle" fill="#111">All credits committed?</text>
<rect x="615.0" y="1400" width="430" height="67" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="1422.5" font-size="11" text-anchor="middle" fill="#111">ERR-06 "Top-up failed. No credits were added."</text>
<text x="830" y="1437.5" font-size="11" text-anchor="middle" fill="#111">Action: roll back transaction, void/flag quotation,</text>
<text x="830" y="1452.5" font-size="11" text-anchor="middle" fill="#111">alert finance for reconciliation</text>
<rect x="165.0" y="1510" width="330" height="46" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="1537.0" font-size="12" text-anchor="middle" fill="#111">Send quotation email to client billing address</text>
<polygon points="330,1610 495.0,1633.0 330,1656 165.0,1633.0" fill="#fff7e6" stroke="#d48806"/>
<text x="330" y="1637.0" font-size="12" text-anchor="middle" fill="#111">Email sent?</text>
<rect x="615.0" y="1610" width="430" height="82" rx="6" fill="#fff1f0" stroke="#cf1322"/>
<text x="830" y="1632.5" font-size="11" text-anchor="middle" fill="#111">WARN-01 "Quotation created and credits added,</text>
<text x="830" y="1647.5" font-size="11" text-anchor="middle" fill="#111">but the email could not be sent."</text>
<text x="830" y="1662.5" font-size="11" text-anchor="middle" fill="#111">Action: queue retry + manual Resend;</text>
<text x="830" y="1677.5" font-size="11" text-anchor="middle" fill="#111">credits REMAIN valid</text>
<rect x="165.0" y="1720" width="330" height="52" rx="6" fill="#f6ffed" stroke="#389e0d"/>
<text x="330" y="1742.5" font-size="12" text-anchor="middle" fill="#111">Write audit log: user, brand, companies,</text>
<text x="330" y="1757.5" font-size="12" text-anchor="middle" fill="#111">amounts, quotation no., timestamp</text>
<rect x="170.0" y="1810" width="320" height="52" rx="6" fill="#e6f4ff" stroke="#0958d9"/>
<text x="330" y="1832.5" font-size="12" text-anchor="middle" fill="#111">END: Success screen with quotation no.</text>
<text x="330" y="1847.5" font-size="12" text-anchor="middle" fill="#111">and updated balance per company</text>
</svg>