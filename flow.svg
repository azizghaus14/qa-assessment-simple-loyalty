<svg viewBox="0 0 1320 1690" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1320" height="1690" fill="#fff"/>
<path d="M340,80 L340,114" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,149 L340,183" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,257 L340,291" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="274" font-size="11" fill="#000">Yes</text>
<path d="M545.0,220.0 L680.0,220.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="557.0" y="213.0" font-size="11" fill="#000">No</text>
<path d="M340,326 L340,360" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,434 L340,468" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="451" font-size="11" fill="#000">Yes</text>
<path d="M555.0,397.0 L680.0,397.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="567.0" y="390.0" font-size="11" fill="#000">No</text>
<path d="M340,518 L340,552" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,602 L340,636" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,710 L340,744" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="727" font-size="11" fill="#000">Yes</text>
<path d="M575.0,673.0 L680.0,673.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="587.0" y="666.0" font-size="11" fill="#000">No</text>
<path d="M340,818 L340,852" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="835" font-size="11" fill="#000">Yes</text>
<path d="M575.0,781.0 L680.0,781.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="587.0" y="774.0" font-size="11" fill="#000">No</text>
<path d="M340,902 L340,936" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,986 L340,1020" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,1094 L340,1128" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="1111" font-size="11" fill="#000">Yes</text>
<path d="M545.0,1057.0 L680.0,1057.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="557.0" y="1050.0" font-size="11" fill="#000">No</text>
<path d="M340,1178 L340,1212" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,1286 L340,1320" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="1303" font-size="11" fill="#000">Yes</text>
<path d="M545.0,1249.0 L680.0,1249.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="557.0" y="1242.0" font-size="11" fill="#000">No</text>
<path d="M340,1370 L340,1404" stroke="#000" fill="none" marker-end="url(#ar)"/>
<path d="M340,1478 L340,1512" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="348" y="1495" font-size="11" fill="#000">Yes</text>
<path d="M535.0,1441.0 L680.0,1441.0" stroke="#000" fill="none" marker-end="url(#ar)"/>
<text x="547.0" y="1434.0" font-size="11" fill="#000">No</text>
<path d="M340,1562 L340,1596" stroke="#000" fill="none" marker-end="url(#ar)"/>
<rect x="190.0" y="30" width="300" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="340" y="51.5" font-size="11.5" text-anchor="middle" fill="#000">START: Finance executive opens the SMS</text>
<text x="340" y="66.5" font-size="11.5" text-anchor="middle" fill="#000">Credit Top-Up screen</text>
<rect x="190.0" y="114" width="300" height="35" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="135.5" font-size="11.5" text-anchor="middle" fill="#000">Load brand list from the MikeTango database</text>
<polygon points="340,183 545.0,220.0 340,257 135.0,220.0" fill="#fff" stroke="#000"/>
<text x="340" y="224.0" font-size="11.5" text-anchor="middle" fill="#000">Brand list loaded?</text>
<rect x="680.0" y="195.0" width="400" height="50" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="216.5" font-size="11.5" text-anchor="middle" fill="#000">ERR-01 "Unable to load brands. Please try again."</text>
<text x="880" y="231.5" font-size="11.5" text-anchor="middle" fill="#000">Action: show Retry. No data changed.</text>
<rect x="190.0" y="291" width="300" height="35" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="312.5" font-size="11.5" text-anchor="middle" fill="#000">Finance executive selects a brand</text>
<polygon points="340,360 555.0,397.0 340,434 125.0,397.0" fill="#fff" stroke="#000"/>
<text x="340" y="401.0" font-size="11.5" text-anchor="middle" fill="#000">Brand has at least one outlet?</text>
<rect x="680.0" y="364.5" width="400" height="65" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="386.0" font-size="11.5" text-anchor="middle" fill="#000">ERR-02 "No outlets found under this brand. Please contact</text>
<text x="880" y="401.0" font-size="11.5" text-anchor="middle" fill="#000">support."</text>
<text x="880" y="416.0" font-size="11.5" text-anchor="middle" fill="#000">Action: return to brand selection.</text>
<rect x="180.0" y="468" width="320" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="489.5" font-size="11.5" text-anchor="middle" fill="#000">Display outlets: outlet name, company (billing</text>
<text x="340" y="504.5" font-size="11.5" text-anchor="middle" fill="#000">entity), current SMS balance</text>
<rect x="190.0" y="552" width="300" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="573.5" font-size="11.5" text-anchor="middle" fill="#000">Finance executive enters a top-up quantity</text>
<text x="340" y="588.5" font-size="11.5" text-anchor="middle" fill="#000">per outlet</text>
<polygon points="340,636 575.0,673.0 340,710 105.0,673.0" fill="#fff" stroke="#000"/>
<text x="340" y="669.5" font-size="11.5" text-anchor="middle" fill="#000">Input valid? Whole number, greater than 0,</text>
<text x="340" y="684.5" font-size="11.5" text-anchor="middle" fill="#000">within maximum, at least one outlet filled</text>
<rect x="680.0" y="633.0" width="400" height="80" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="654.5" font-size="11.5" text-anchor="middle" fill="#000">ERR-03 inline, per field: "Enter a whole number greater</text>
<text x="880" y="669.5" font-size="11.5" text-anchor="middle" fill="#000">than 0" / "Maximum 100,000 credits per outlet" / "Enter a</text>
<text x="880" y="684.5" font-size="11.5" text-anchor="middle" fill="#000">top-up for at least one outlet"</text>
<text x="880" y="699.5" font-size="11.5" text-anchor="middle" fill="#000">Action: block NEXT. Entered values are kept.</text>
<polygon points="340,744 575.0,781.0 340,818 105.0,781.0" fill="#fff" stroke="#000"/>
<text x="340" y="777.5" font-size="11.5" text-anchor="middle" fill="#000">Billing email present and valid for every</text>
<text x="340" y="792.5" font-size="11.5" text-anchor="middle" fill="#000">selected company?</text>
<rect x="680.0" y="748.5" width="400" height="65" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="770.0" font-size="11.5" text-anchor="middle" fill="#000">ERR-04 "Billing email missing or invalid for {company}.</text>
<text x="880" y="785.0" font-size="11.5" text-anchor="middle" fill="#000">Update the client record first."</text>
<text x="880" y="800.0" font-size="11.5" text-anchor="middle" fill="#000">Action: block NEXT. No quotation, no credits.</text>
<rect x="190.0" y="852" width="300" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="873.5" font-size="11.5" text-anchor="middle" fill="#000">Click NEXT: lock the button and create an</text>
<text x="340" y="888.5" font-size="11.5" text-anchor="middle" fill="#000">idempotency key</text>
<rect x="180.0" y="936" width="320" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="957.5" font-size="11.5" text-anchor="middle" fill="#000">Call the QuickBooks API to generate a</text>
<text x="340" y="972.5" font-size="11.5" text-anchor="middle" fill="#000">quotation, one line item per company</text>
<polygon points="340,1020 545.0,1057.0 340,1094 135.0,1057.0" fill="#fff" stroke="#000"/>
<text x="340" y="1061.0" font-size="11.5" text-anchor="middle" fill="#000">Quotation generated?</text>
<rect x="680.0" y="1017.0" width="400" height="80" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="1038.5" font-size="11.5" text-anchor="middle" fill="#000">ERR-05 "Quotation could not be generated. No credits have</text>
<text x="880" y="1053.5" font-size="11.5" text-anchor="middle" fill="#000">been added."</text>
<text x="880" y="1068.5" font-size="11.5" text-anchor="middle" fill="#000">Action: retry with the SAME idempotency key, so no</text>
<text x="880" y="1083.5" font-size="11.5" text-anchor="middle" fill="#000">duplicate quotation and no partial credit.</text>
<rect x="175.0" y="1128" width="330" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="1149.5" font-size="11.5" text-anchor="middle" fill="#000">Credit SMS to EACH company account in one</text>
<text x="340" y="1164.5" font-size="11.5" text-anchor="middle" fill="#000">atomic transaction (balance = balance + top-up)</text>
<polygon points="340,1212 545.0,1249.0 340,1286 135.0,1249.0" fill="#fff" stroke="#000"/>
<text x="340" y="1253.0" font-size="11.5" text-anchor="middle" fill="#000">All credits committed?</text>
<rect x="680.0" y="1216.5" width="400" height="65" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="1238.0" font-size="11.5" text-anchor="middle" fill="#000">ERR-06 "Top-up failed. No credits were added."</text>
<text x="880" y="1253.0" font-size="11.5" text-anchor="middle" fill="#000">Action: roll back the transaction, void or flag the</text>
<text x="880" y="1268.0" font-size="11.5" text-anchor="middle" fill="#000">quotation, alert finance for reconciliation.</text>
<rect x="190.0" y="1320" width="300" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="1341.5" font-size="11.5" text-anchor="middle" fill="#000">Send the quotation email to the company</text>
<text x="340" y="1356.5" font-size="11.5" text-anchor="middle" fill="#000">billing address</text>
<polygon points="340,1404 535.0,1441.0 340,1478 145.0,1441.0" fill="#fff" stroke="#000"/>
<text x="340" y="1445.0" font-size="11.5" text-anchor="middle" fill="#000">Email sent?</text>
<rect x="680.0" y="1401.0" width="400" height="80" rx="3" fill="#f2f2f2" stroke="#000" stroke-dasharray="5,3"/>
<text x="880" y="1422.5" font-size="11.5" text-anchor="middle" fill="#000">WARN-01 "Quotation created and credits added, but the email</text>
<text x="880" y="1437.5" font-size="11.5" text-anchor="middle" fill="#000">could not be sent."</text>
<text x="880" y="1452.5" font-size="11.5" text-anchor="middle" fill="#000">Action: queue a retry and offer Resend. Credits REMAIN</text>
<text x="880" y="1467.5" font-size="11.5" text-anchor="middle" fill="#000">valid.</text>
<rect x="175.0" y="1512" width="330" height="50" rx="3" fill="#fff" stroke="#000"/>
<text x="340" y="1533.5" font-size="11.5" text-anchor="middle" fill="#000">Write the audit log: user, brand, companies,</text>
<text x="340" y="1548.5" font-size="11.5" text-anchor="middle" fill="#000">amounts, quotation number, timestamp</text>
<rect x="180.0" y="1596" width="320" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="340" y="1617.5" font-size="11.5" text-anchor="middle" fill="#000">END: success screen with the quotation number</text>
<text x="340" y="1632.5" font-size="11.5" text-anchor="middle" fill="#000">and the updated balance per company</text>
</svg>